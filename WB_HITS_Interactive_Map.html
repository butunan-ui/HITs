 const lat=Number(r.latitude),lon=Number(r.longitude);if(!Number.isFinite(lat)||!Number.isFinite(lon))return;
 const ch=r['Under CH']||'Unassigned',color=chColors[ch]||'#555';
 const icon=L.divIcon({className:'',html:`<div style="width:15px;height:15px;border-radius:50%;background:${color};border:2px solid white;box-shadow:0 1px 5px rgba(0,0,0,.45)"></div>`,iconSize:[15,15],iconAnchor:[7.5,7.5]});
 const m=L.marker([lat,lon],{icon});
 m.bindPopup(popupHTML(r),{maxWidth:350});
 m.bindTooltip(`${r['Location for HITS']} • ACB: ${fmt(r['ACB'])} • LCO: ${fmt(r['LCO Count'])}`,{permanent:true,direction:'top',offset:[0,-7],className:'location-label'});
 m.on('click',()=>openDetails(i));markersByIndex[i]=m;allPoints.push([lat,lon]);allBounds.extend([lat,lon]);m.addTo(markerLayer);
});

const legend=document.getElementById('chLegend');
chs.forEach(ch=>{const el=document.createElement('div');el.className='chItem';el.innerHTML=`<span class="dot" style="background:${chColors[ch]}"></span>${esc(ch)}`;el.onclick=()=>filterCH(ch);legend.appendChild(el);});

document.getElementById('stats').textContent=`${rows.length} HITS locations • ${chs.length} CH groups`;
document.getElementById('showAllBtn').onclick=showAll;
document.getElementById('fitBtn').onclick=()=>{if(allBounds.isValid())map.fitBounds(allBounds,{padding:[20,20]});};
document.getElementById('closeBtn').onclick=closeDetails;

const search=document.getElementById('search'),results=document.getElementById('searchResults');
search.addEventListener('input',()=>{
 const q=search.value.trim().toLowerCase();if(!q){results.style.display='none';return;}
 const hits=rows.map((r,i)=>({r,i})).filter(x=>columns.map(c=>String(x.r[c]??'')).join(' ').toLowerCase().includes(q)).slice(0,40);
 results.innerHTML=hits.length?hits.map(x=>`<div class="result" data-i="${x.i}"><div class="loc">${esc(x.r['Location for HITS'])}</div><div class="small">CH: ${esc(x.r['Under CH'])} • District: ${esc(x.r['Dist'])} • ACB: ${fmt(x.r['ACB'])} • LCO: ${fmt(x.r['LCO Count'])}</div></div>`).join(''):'<div class="result">No matching location found.</div>';
 results.style.display='block';
 results.querySelectorAll('.result[data-i]').forEach(el=>el.addEventListener('click',()=>{const i=Number(el.dataset.i);openDetails(i);results.style.display='none';search.value=rows[i]['Location for HITS'];}));
});
document.addEventListener('click',e=>{if(!results.contains(e.target)&&e.target!==search)results.style.display='none';});

fetch(districtURL).then(r=>r.json()).then(geo=>{
 L.geoJSON(geo,{style:()=>({color:'#5d6670',weight:1.2,fillColor:'#cfd8e3',fillOpacity:.10}),
 onEachFeature:(feature,layer)=>{const p=feature.properties||{};const name=p.DISTRICT||p.District||p.district||p.DT_NAME||p.dtname||p.NAME||p.name||'';if(name)layer.bindTooltip(name,{sticky:true});}}).addTo(map);
 markerLayer.bringToFront();
}).catch(err=>console.warn('District boundary layer could not be loaded:',err));

if(allBounds.isValid())map.fitBounds(allBounds,{padding:[25,25]});
</script>
</body></html>
